services:
  # Oracle Database service
  oracle-db:
    image: container-registry.oracle.com/database/express:21.3.0-xe
    container_name: photoalbum-oracle
    environment:
      - ORACLE_PWD=${ORACLE_PASSWORD:?ORACLE_PASSWORD must be set (copy .env.example to .env)}
      - ORACLE_CHARACTERSET=AL32UTF8
      - APP_USER=${APP_USER:-photoalbum}
      - APP_USER_PASSWORD=${APP_USER_PASSWORD:?APP_USER_PASSWORD must be set (copy .env.example to .env)}
    ports:
      - "1521:1521"
      - "5500:5500"
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./oracle-init:/opt/oracle/scripts/startup
    networks:
      - photoalbum-network
    healthcheck:
      test: ["CMD-SHELL", "echo 'SELECT 1 FROM DUAL;' | sqlplus -s $${APP_USER}/$${APP_USER_PASSWORD}@//localhost:1521/XE || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 180s

  # Photo Album Java Application  
  photoalbum-java-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: photoalbum-java-app
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@oracle-db:1521:XE
      - SPRING_DATASOURCE_USERNAME=${APP_USER:-photoalbum}
      - SPRING_DATASOURCE_PASSWORD=${APP_USER_PASSWORD:?APP_USER_PASSWORD must be set (copy .env.example to .env)}
    ports:
      - "8080:8080"
    depends_on:
      oracle-db:
        condition: service_healthy
    networks:
      - photoalbum-network
    restart: on-failure

volumes:
  oracle_data:

networks:
  photoalbum-network:
    driver: bridge